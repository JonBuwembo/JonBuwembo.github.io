<!DOCTYPE html>
    <header>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
        <title>Portfolio Buwembo</title>

        <!-- Linking CSS files in the correct order for proper styling -->
        <link rel="stylesheet" href="./css/variables.css">
        <link rel="stylesheet" href="./css/reset.css">
        <link rel="stylesheet" href="./css/base.css">
        <link rel="stylesheet" href="./css/sections.css">
        <link rel="stylesheet" href="./css/responsive.css">
        <link rel="stylesheet" href="./css/components.css">
    </header>

    <body class="email-body-container">
        <main id="email-page-wrapper">
            <section id="sendemail">
                <h1 class="message-text-title" data-text="Send Message">Send Me a Message!</h1>
                <h2>Have a question or want to get in touch? Send me a message.</h2>
            </section>

            <div>
                <form class="form-container" id="contact-form">
                    <div class="form-side-by-side">
                        <div class="form-group">
                            <label for="name">Your Name</label>
                            <input type="text" id="name" name="name" placeholder="Enter Your Name" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Your Email</label>
                            <input type="email" id="email" name="email" placeholder="Enter Your Email" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="subject" id="subject" name="subject" placeholder="Enter Your Subject" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Message </label>
                        <textarea rows="5" cols="40" id="message" name="message" rows="5" placeholder="Type Your Message"></textarea>                    
                    </div>

                    <button type="submit" id="submit-contact-form">Send Message </button>

                    <p> Back To <a href="index.html">Portfolio</a></p>
                </form>

                <p id="sent-status"> </p>
            </div>
           
        </main>

        <script type="module" src="js/main.js"></script>
        
        <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
        <script type="module" src="/js/submission.js"></script>
    </body>

</html>
